<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORACULO — AI News Intelligence</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080c14;
      --surface: #0d1117;
      --surface2: #161b22;
      --border: #21262d;
      --border2: #30363d;
      --blue: #58a6ff;
      --blue-dim: #1c2d3f;
      --green: #3fb950;
      --green-dim: #1f3a23;
      --purple: #a5a0f8;
      --purple-dim: #1f1f2e;
      --orange: #f8a14f;
      --orange-dim: #2d1f10;
      --text: #e1e4e8;
      --text-muted: #8b949e;
      --text-dim: #484f58;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #1a6fff, #7b3ff8);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { display: block; }
    .logo-text {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text);
    }
    .logo-sep {
      width: 1px; height: 22px;
      background: var(--border2);
      margin: 0 12px;
    }
    .logo-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot-live {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }
    .live-label {
      font-size: 0.72rem;
      color: var(--green);
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    /* ── LAYOUT ── */
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { order: -1; }
    }

    /* ── SEARCH ── */
    .search-wrap {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .search-input-wrap {
      flex: 1;
      position: relative;
    }
    .search-input-wrap svg {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }
    .search-row input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-row input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(88,166,255,.1);
    }
    .search-row input::placeholder { color: var(--text-dim); }

    .btn-primary {
      padding: 12px 22px;
      background: linear-gradient(135deg, #1a6fff, #7b3ff8);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .15s;
      letter-spacing: 0.03em;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-label { font-size: 0.78rem; color: var(--text-muted); }
    .filter-select {
      padding: 5px 10px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
    }
    .examples {
      margin-left: auto;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 4px 11px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--blue); color: var(--blue); }

    /* ── STATUS ── */
    .status-bar {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-flex; align-items: center;
      background: var(--blue-dim);
      border: 1px solid #1f4068;
      border-radius: 10px;
      padding: 2px 10px;
      color: #79c0ff;
      font-size: 0.75rem;
      gap: 4px;
    }

    /* ── CARDS ── */
    .results { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      transition: border-color .15s, transform .1s;
      position: relative;
    }
    .card:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 9px;
    }
    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-source { background: var(--green-dim); color: #7ee787; }
    .badge-cat    { background: var(--blue-dim);  color: #79c0ff; }
    .badge-date   { background: var(--purple-dim); color: var(--purple); }

    /* circular score */
    .score-ring {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .score-ring svg { display: block; }
    .score-pct {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--orange);
    }

    .card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 7px;
    }
    .card h3 a { color: var(--blue); text-decoration: none; }
    .card h3 a:hover { text-decoration: underline; }

    .card-snippet {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 8px;
    }
    .match-reason {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-style: italic;
    }

    /* skeleton */
    .skeleton { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
    .skel-line {
      background: var(--border2);
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .skel-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }

    /* empty / error */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty svg { margin-bottom: 14px; opacity: .3; }
    .empty p { font-size: 0.9rem; }
    .empty .hint { font-size: 0.8rem; margin-top: 6px; color: var(--text-dim); }

    .toast-error {
      background: #2d1010;
      border: 1px solid #6e1515;
      border-radius: 8px;
      padding: 12px 16px;
      color: #f47e7e;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 76px;
    }

    .panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .toggle-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 6px;
      overflow: hidden;
    }
    .toggle-btn {
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      transition: background .15s, color .15s;
    }
    .toggle-btn.active {
      background: var(--blue-dim);
      color: var(--blue);
    }

    .panel-body { padding: 14px 16px; }

    .kw-list { display: flex; flex-direction: column; gap: 6px; }
    .kw-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .12s;
    }
    .kw-row:hover { background: var(--surface); }
    .kw-term {
      font-size: 0.8rem;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }
    .kw-bar-wrap {
      width: 60px;
      height: 4px;
      background: var(--border2);
      border-radius: 2px;
      overflow: hidden;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .kw-bar { height: 100%; background: var(--blue); border-radius: 2px; }
    .kw-cnt {
      font-size: 0.7rem;
      color: var(--text-muted);
      min-width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    .kw-empty {
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    /* stats panel */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-muted); }
    .stat-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
    </svg>
  </div>
  <span class="logo-text">ORACULO</span>
  <div class="logo-sep"></div>
  <span class="logo-sub">AI News Intelligence · 20,915 articles · May 10–15 2026</span>
  <div class="header-right">
    <div class="dot-live"></div>
    <span class="live-label">LIVE</span>
  </div>
</header>

<div class="layout">

  <!-- MAIN COLUMN -->
  <div class="main">

    <div class="search-wrap">
      <div class="search-row">
        <div class="search-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="queryInput" type="text"
            placeholder="Ask anything — e.g. SOCAR news on May 18-21, or negative bank stories" />
        </div>
        <button class="btn-primary" id="searchBtn" onclick="doSearch()">Search</button>
      </div>

      <div class="filter-row">
        <span class="filter-label">Results:</span>
        <select class="filter-select" id="topK">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
        <div class="examples">
          <span class="chip" onclick="fillAndSearch('AccessBank haqqında xəbərlər')">AccessBank</span>
          <span class="chip" onclick="fillAndSearch('SOCAR may 12-də')">SOCAR May 12</span>
          <span class="chip" onclick="fillAndSearch('may 10-12 arasında gömrük xəbərləri')">Customs May 10–12</span>
          <span class="chip" onclick="fillAndSearch('may 13-15 arasında mənfi bank xəbərləri')">Negative bank news</span>
          <span class="chip" onclick="fillAndSearch('vergi iqtisadiyyat')">Tax / Economy</span>
        </div>
      </div>
    </div>

    <div id="statusBar" class="status-bar"></div>
    <div id="results" class="results"></div>

  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- Keywords panel -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Top Keywords</span>
        <div class="toggle-group">
          <button class="toggle-btn active" id="kwToggleGlobal" onclick="setKwMode('global')">Global</button>
          <button class="toggle-btn" id="kwToggleSearch" onclick="setKwMode('search')">Search</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="kwList" class="kw-list">
          <div class="kw-empty">Run a search or load global keywords</div>
        </div>
        <div style="margin-top:12px">
          <button class="chip" style="width:100%;text-align:center;padding:6px" onclick="loadGlobalKeywords()">
            Load global keywords
          </button>
        </div>
      </div>
    </div>

    <!-- Stats panel -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Session Stats</span>
      </div>
      <div class="panel-body" style="padding:12px 16px">
        <div class="stat-row">
          <span class="stat-label">Index size</span>
          <span class="stat-val">20,915</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Coverage</span>
          <span class="stat-val">May 10–15</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Queries run</span>
          <span class="stat-val" id="statQueries">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Last topic</span>
          <span class="stat-val" id="statTopic" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Avg results</span>
          <span class="stat-val" id="statAvg">—</span>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
const API = '';
let _kwMode = 'global';
let _lastQuery = '';
let _queryCount = 0;
let _totalResults = 0;

function setKwMode(mode) {
  _kwMode = mode;
  document.getElementById('kwToggleGlobal').classList.toggle('active', mode === 'global');
  document.getElementById('kwToggleSearch').classList.toggle('active', mode === 'search');
  if (mode === 'global') loadGlobalKeywords();
  else if (_lastQuery) loadSearchKeywords(_lastQuery);
}

// ── SEARCH ─────────────────────────────────────────────
async function doSearch(query) {
  query = query || document.getElementById('queryInput').value.trim();
  if (!query) return;
  document.getElementById('queryInput').value = query;
  _lastQuery = query;

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="vertical-align:middle;margin-right:6px"></span>Searching…';

  const topK = parseInt(document.getElementById('topK').value);
  const statusBar = document.getElementById('statusBar');
  const resultsDiv = document.getElementById('results');

  statusBar.innerHTML = '<span class="spinner"></span><span style="margin-left:6px">Processing query…</span>';
  resultsDiv.innerHTML = renderSkeletons(3);

  try {
    const res = await fetch(`${API}/api/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: topK })
    });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();

    const params   = data.params   || {};
    const articles = data.results  || [];
    const total    = data.total_in_range || 0;

    // update stats
    _queryCount++;
    _totalResults += articles.length;
    document.getElementById('statQueries').textContent = _queryCount;
    document.getElementById('statTopic').textContent   = params.topic || query;
    document.getElementById('statAvg').textContent     = (_totalResults / _queryCount).toFixed(1);

    // status bar
    let statusHtml = `<strong>${articles.length}</strong> results`;
    if (total) statusHtml += `<span style="color:var(--text-dim)"> of ${total} matching</span>`;
    if (params.topic) statusHtml += `<span class="pill">🎯 ${params.topic}</span>`;
    if (params.date_from || params.date_to) {
      statusHtml += `<span class="pill">📅 ${params.date_from||'…'} → ${params.date_to||'…'}</span>`;
    }
    if (params.sentiment) {
      const s = params.sentiment === 'negative' ? '🔴' : '🟢';
      statusHtml += `<span class="pill">${s} ${params.sentiment}</span>`;
    }
    statusBar.innerHTML = statusHtml;

    if (!articles.length) {
      resultsDiv.innerHTML = `
        <div class="empty">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <p>No results found</p>
          <p class="hint">Try different keywords or broaden the date range</p>
        </div>`;
    } else {
      resultsDiv.innerHTML = articles.map(renderCard).join('');
    }

    // auto-load search keywords in sidebar
    if (_kwMode === 'search') loadSearchKeywords(query);

  } catch (err) {
    statusBar.innerHTML = '';
    resultsDiv.innerHTML = `
      <div class="toast-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Search failed: ${err.message}. Check your connection and try again.
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

// ── CARD RENDER ────────────────────────────────────────
function renderCard(a) {
  const date    = (a.published_at || '').slice(0, 10);
  const snippet = (a.snippet || '').slice(0, 200);
  const pct     = a.relevance_score ? Math.round(a.relevance_score * 100) : 0;
  const radius  = 16;
  const circ    = 2 * Math.PI * radius;
  const dash    = (pct / 100) * circ;

  // pick ring color by score
  const ringColor = pct >= 65 ? '#3fb950' : pct >= 45 ? '#f8a14f' : '#58a6ff';

  const matchReason = pct >= 65
    ? 'Strong semantic match to query topic'
    : pct >= 45
    ? 'Partial relevance — related entities found'
    : 'Contextually related article';

  return `
    <div class="card">
      <div class="card-top">
        <div class="card-badges">
          ${a.source   ? `<span class="badge badge-source">${a.source}</span>` : ''}
          ${a.category ? `<span class="badge badge-cat">${a.category}</span>` : ''}
          ${date       ? `<span class="badge badge-date">${date}</span>` : ''}
        </div>
        ${pct ? `
        <div class="score-ring" title="AI Relevance Score">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="${radius}" fill="none" stroke="#21262d" stroke-width="3"/>
            <circle cx="20" cy="20" r="${radius}" fill="none" stroke="${ringColor}" stroke-width="3"
              stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
              stroke-linecap="round"
              transform="rotate(-90 20 20)"/>
            <text x="20" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="${ringColor}">${pct}%</text>
          </svg>
        </div>` : ''}
      </div>
      <h3><a href="${a.url}" target="_blank" rel="noopener">${a.title || 'No title'}</a></h3>
      <p class="card-snippet">${snippet}${snippet.length >= 200 ? '…' : ''}</p>
      <p class="match-reason">⚡ ${matchReason}</p>
    </div>`;
}

// ── SKELETONS ─────────────────────────────────────────
function renderSkeletons(n) {
  return Array.from({length: n}, () => `
    <div class="skel-card skeleton">
      <div class="skel-line" style="width:30%;height:14px"></div>
      <div class="skel-line" style="width:80%;height:16px;margin-top:10px"></div>
      <div class="skel-line" style="width:95%;height:12px"></div>
      <div class="skel-line" style="width:70%;height:12px"></div>
    </div>`).join('');
}

// ── KEYWORDS ──────────────────────────────────────────
async function loadGlobalKeywords() {
  renderKwLoading();
  try {
    const res  = await fetch(`${API}/api/keywords?top_n=20`);
    const data = await res.json();
    renderKeywords(data.keywords);
  } catch { renderKwError(); }
}

async function loadSearchKeywords(query) {
  renderKwLoading();
  try {
    const res = await fetch(`${API}/api/keywords/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 50 })
    });
    const data = await res.json();
    renderKeywords(data.keywords);
  } catch { renderKwError(); }
}

function renderKeywords(kws) {
  if (!kws || !kws.length) {
    document.getElementById('kwList').innerHTML = '<div class="kw-empty">No keywords found</div>';
    return;
  }
  const max = kws[0].count || 1;
  document.getElementById('kwList').innerHTML = kws.map(k => `
    <div class="kw-row" onclick="fillAndSearch('${k.term.replace(/'/g,"\\'")}')">
      <span class="kw-term">${k.term}</span>
      <div class="kw-bar-wrap">
        <div class="kw-bar" style="width:${Math.round(k.count/max*100)}%"></div>
      </div>
      <span class="kw-cnt">${k.count}</span>
    </div>`).join('');
}

function renderKwLoading() {
  document.getElementById('kwList').innerHTML = `
    <div class="kw-empty">
      <span class="spinner" style="display:inline-block;margin-bottom:6px"></span><br>Loading…
    </div>`;
}
function renderKwError() {
  document.getElementById('kwList').innerHTML = '<div class="kw-empty" style="color:#f47e7e">Failed to load</div>';
}

// ── UTILS ─────────────────────────────────────────────
function fillAndSearch(q) {
  document.getElementById('queryInput').value = q;
  doSearch(q);
}

document.getElementById('queryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
