<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neurotime Xəbər Axtarışı</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
      border-bottom: 1px solid #21262d;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #58a6ff; }
    header p { font-size: 0.8rem; color: #8b949e; margin-top: 2px; }

    .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .search-box input {
      flex: 1;
      padding: 14px 18px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e1e4e8;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .search-box input:focus { border-color: #58a6ff; }
    .search-box input::placeholder { color: #484f58; }

    .search-box button {
      padding: 14px 24px;
      background: #238636;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .search-box button:hover { background: #2ea043; }
    .search-box button:disabled { background: #1f3a23; color: #4a6741; cursor: not-allowed; }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .controls label { font-size: 0.85rem; color: #8b949e; }
    .controls select {
      padding: 6px 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e1e4e8;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-kw {
      margin-left: auto;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #58a6ff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .btn-kw:hover { border-color: #58a6ff; background: #1c2d3f; }

    .status-bar {
      font-size: 0.82rem;
      color: #8b949e;
      margin-bottom: 18px;
      min-height: 18px;
    }
    .status-bar .pill {
      display: inline-block;
      background: #1c2d3f;
      border: 1px solid #1f4068;
      border-radius: 12px;
      padding: 2px 10px;
      margin-right: 6px;
      color: #79c0ff;
    }

    .results { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 18px 20px;
      transition: border-color .2s;
    }
    .card:hover { border-color: #30363d; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge-source { background: #1f3a23; color: #7ee787; }
    .badge-cat { background: #1c2d3f; color: #79c0ff; }
    .badge-date { background: #1f1f28; color: #a8a0f8; }
    .badge-score { background: #2d1f10; color: #f8a14f; }

    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .card h3 a { color: #58a6ff; text-decoration: none; }
    .card h3 a:hover { text-decoration: underline; }

    .card p { font-size: 0.875rem; color: #8b949e; line-height: 1.6; }

    /* Keywords panel */
    .kw-panel {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .kw-panel h2 { font-size: 0.95rem; color: #8b949e; margin-bottom: 14px; }
    .kw-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .kw-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color .2s;
    }
    .kw-chip:hover { border-color: #58a6ff; }
    .kw-chip .cnt {
      background: #21262d;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 0.75rem;
      color: #8b949e;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #484f58;
    }
    .empty svg { margin-bottom: 16px; opacity: .4; }
    .empty p { font-size: 0.95rem; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .examples {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .example-chip {
      padding: 5px 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #8b949e;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .example-chip:hover { border-color: #58a6ff; color: #58a6ff; }
  </style>
</head>
<body>

<header>
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <div>
    <h1>Neurotime Xəbər Axtarışı</h1>
    <p>~20 000 məqalə · AI əsaslı semantik axtarış · 10–15 may 2026</p>
  </div>
</header>

<div class="container">

  <div class="search-box">
    <input id="queryInput" type="text" placeholder="Mövzu, şirkət, şəxs, tarix… məs: SOCAR haqqında may 18-21 arasında" />
    <button id="searchBtn" onclick="doSearch()">Axtar</button>
  </div>

  <div class="controls">
    <label>Nəticə sayı:</label>
    <select id="topK">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
      <option value="50">50</option>
    </select>
    <button class="btn-kw" onclick="loadGlobalKeywords()">🔑 Qlobal açar sözlər</button>
  </div>

  <div class="examples">
    <span class="example-chip" onclick="fillAndSearch('AccessBank haqqında xəbərlər')">AccessBank haqqında xəbərlər</span>
    <span class="example-chip" onclick="fillAndSearch('SOCAR may 12-də')">SOCAR may 12-də</span>
    <span class="example-chip" onclick="fillAndSearch('may 10-12 arasında gömrük xəbərləri')">may 10-12 arasında gömrük</span>
    <span class="example-chip" onclick="fillAndSearch('may 13-15 arasında mənfi bank xəbərləri')">mənfi bank xəbərləri</span>
    <span class="example-chip" onclick="fillAndSearch('vergi iqtisadiyyat')">vergi / iqtisadiyyat</span>
  </div>

  <div style="height:28px"></div>

  <div id="kwPanel" class="kw-panel" style="display:none">
    <h2 id="kwTitle">🔑 Açar sözlər</h2>
    <div id="kwList" class="kw-list"></div>
  </div>

  <div id="statusBar" class="status-bar"></div>
  <div id="results" class="results"></div>

</div>

<script>
const API = '';  // same origin

async function doSearch(query) {
  query = query || document.getElementById('queryInput').value.trim();
  if (!query) return;
  document.getElementById('queryInput').value = query;

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Axtarılır…';

  const topK = parseInt(document.getElementById('topK').value);
  const statusBar = document.getElementById('statusBar');
  const resultsDiv = document.getElementById('results');

  statusBar.innerHTML = '<span class="spinner"></span> Sorğu emal edilir…';
  resultsDiv.innerHTML = '';
  document.getElementById('kwPanel').style.display = 'none';

  try {
    const res = await fetch(`${API}/api/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: topK })
    });
    const data = await res.json();

    const params = data.params || {};
    const articles = data.results || [];
    const total = data.total_in_range || 0;

    let statusHtml = `<strong>${articles.length}</strong> nəticə`;
    if (total) statusHtml += ` (filtrə uyğun: ${total})`;
    if (params.topic) statusHtml += ` &nbsp;·&nbsp; <span class="pill">🎯 ${params.topic}</span>`;
    if (params.date_from || params.date_to) {
      const df = params.date_from || '…';
      const dt = params.date_to || '…';
      statusHtml += `<span class="pill">📅 ${df} → ${dt}</span>`;
    }
    statusBar.innerHTML = statusHtml;

    if (!articles.length) {
      resultsDiv.innerHTML = `
        <div class="empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <p>Heç bir nəticə tapılmadı. Fərqli açar sözlər sınayın.</p>
        </div>`;
      return;
    }

    resultsDiv.innerHTML = articles.map(a => {
      const date = (a.published_at || '').slice(0, 10);
      const snippet = (a.snippet || '').slice(0, 220);
      const score = a.relevance_score ? (a.relevance_score * 100).toFixed(0) + '%' : '';
      return `
        <div class="card">
          <div class="card-meta">
            ${a.source ? `<span class="badge badge-source">${a.source}</span>` : ''}
            ${a.category ? `<span class="badge badge-cat">${a.category}</span>` : ''}
            ${date ? `<span class="badge badge-date">${date}</span>` : ''}
            ${score ? `<span class="badge badge-score">⚡ ${score}</span>` : ''}
          </div>
          <h3><a href="${a.url}" target="_blank" rel="noopener">${a.title || 'Başlıq yoxdur'}</a></h3>
          <p>${snippet}${snippet.length === 220 ? '…' : ''}</p>
        </div>`;
    }).join('');

    // Show keyword button for search results
    document.getElementById('kwPanel').style.display = 'none';
    loadSearchKeywords(query);

  } catch (err) {
    statusBar.innerHTML = '❌ Xəta baş verdi: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Axtar';
  }
}

async function loadGlobalKeywords() {
  const panel = document.getElementById('kwPanel');
  const title = document.getElementById('kwTitle');
  const list = document.getElementById('kwList');
  panel.style.display = 'block';
  title.textContent = '⏳ Yüklənir…';
  list.innerHTML = '';

  const res = await fetch(`${API}/api/keywords?top_n=30`);
  const data = await res.json();
  renderKeywords(data.keywords, '🔑 Qlobal açar sözlər (bütün dataset)');
}

async function loadSearchKeywords(query) {
  const res = await fetch(`${API}/api/keywords/search`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, top_k: 50 })
  });
  const data = await res.json();
  if (data.keywords && data.keywords.length) {
    renderKeywords(data.keywords, '🔑 Bu nəticələrdə ən çox rast gəlinən:');
  }
}

function renderKeywords(keywords, titleText) {
  const panel = document.getElementById('kwPanel');
  const title = document.getElementById('kwTitle');
  const list = document.getElementById('kwList');
  panel.style.display = 'block';
  title.textContent = titleText;
  list.innerHTML = keywords.map(k =>
    `<span class="kw-chip" onclick="fillAndSearch('${k.term.replace(/'/g, "\\'")}')">
      ${k.term} <span class="cnt">${k.count}</span>
    </span>`
  ).join('');
}

function fillAndSearch(q) {
  document.getElementById('queryInput').value = q;
  doSearch(q);
}

document.getElementById('queryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
